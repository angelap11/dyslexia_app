name: dyslexia_app
description: "Android application to support children with dyslexia."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_dotenv: ^6.0.1
  cupertino_icons: ^1.0.8
  file_picker: ^8.0.7
  flutter_tts: ^4.2.5
  google_mlkit_text_recognition: ^0.15.1
  image_picker: ^1.0.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  crypto: ^3.0.6
  provider: ^6.1.5
  geolocator: ^14.0.2
  url_launcher: ^6.3.1


  sqflite: ^2.4.2
  archive: ^4.0.7
  xml: ^6.6.1
  path: ^1.9.1


  syncfusion_flutter_pdf: ^33.2.10

  http: ^1.2.2
  audioplayers: ^6.1.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/fonts/

  fonts:
    - family: DyslexicFont
      fonts:
        - asset: assets/fonts/DyslexicFZF Regular.ttf