name: dyslexia_app
description: "Android application to support children with dyslexia."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_dotenv: ^6.0.1
  file_picker: ^8.0.7
  image_picker: ^1.0.7
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  provider: ^6.1.5
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  intl: ^0.20.2

  sqflite: ^2.4.2
  archive: ^4.0.7
  xml: ^6.6.1
  path: ^1.9.1

  syncfusion_flutter_pdf: ^33.2.10

  http: ^1.2.2
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  image: ^4.5.4
  tesseract_ocr: ^0.5.0
  cloud_firestore: ^6.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.7+1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/fonts/
    - assets/tessdata_config.json
    - assets/tessdata/

  fonts:
    - family: DyslexicFont
      fonts:
        - asset: assets/fonts/DyslexicFZF Regular.ttf